<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Alunos</title>
</head>
<body>
    <h1>Alunos</h1>

    <p><a href="{% url 'alunos:criar' %}">Cadastrar aluno</a></p>

    <ul>
        {% for aluno in alunos %}
            <li>
                {{ aluno.nome }} — {{ aluno.email }} — Matrícula: {{ aluno.matricula }}
                <a href="{% url 'alunos:editar' aluno.pk %}">Editar</a>
                <a href="{% url 'alunos:excluir' aluno.pk %}">Excluir</a>
            </li>
        {% empty %}
            <li>Nenhum aluno cadastrado.</li>
        {% endfor %}
    </ul>
    <form method=""get" action"{% url 'alunos:lista' %}">
        <input
            id=""busca" 
            type="search" 
            name="q" 
            placeholder="Pesquisar..."
            value="{{ termo }}">
        <button type="submit">Pesquisar</button>
        {% if request.GET.q %}
            <a href="{% url 'alunos:lista' %}">Limpar</a>
        {% endif %}
    </form>
    <form method="post" action="{% url 'contas:logout' %}">
    {% csrf_token %}
    <button type="submit">Sair</button>
</form>
</body>
</html>
