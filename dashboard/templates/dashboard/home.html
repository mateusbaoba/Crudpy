<!doctype html>
<html lang=""pt-br>
    <head>
        <meta charset="utf-8">
        <title>Dashboard</title>
        <link rel ="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'dashboard:home' %}">
                    Gestão Acadêmica</a>                
            </div>
        </nav>

        <main class="container py-5">
            <div class="row g-4">
                <div class="col-12 col-md-4">
                    <section class="card">
                        <div class="card-body">
                            <h2 class="card-title">Alunos cadastrados</h2>
                            <p class="card-text">{{ total_alunos }}</p>
                            <a class="btn btn-primary" href="{% url 'alunos:lista' %}">Ver lista de alunos</a>
                        </div>
                    </section>

                </div>
                <div class="col-12 col-md-4">
                    <section class="card">
                        <div class="card-body">
                            <h2 class="card-title">Disciplinas cadastradas</h2>
                            <p class="card-text">{{ total_disciplinas }}</p>
                            <a class="btn btn-primary" href="{% url 'disciplinas:lista' %}">Ver lista de disciplinas</a>
                        </div>
                    </section>

                </div>
            </div>
            <div style="height: 300px">
                <canvas id="matriculasChart"> 
                    {{ matriculas_por_disciplina|json_script:"matriculas-data" }}
                </canvas>
            </div>
        </main>
    </body>
</html>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
    const matriculas = JSON.parse(
        document.getElementById("matriculas-data").textContent
    );

    new Chart(document.getElementById("matriculasChart"), {
        type: "bar",
        data: {
            labels: matriculas.map((item) => item.nome),
            datasets: [{
                label: "Alunos matriculados",
                data: matriculas.map((item) => item.total)
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { precision: 0 }
                }
            }
        }
    });
</script>
