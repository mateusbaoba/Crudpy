<h1>Disciplinas</h1>
<a href="{% url 'disciplinas:criar' %}">Cadastrar disciplina</a>

<ul>
    {% for disciplina in disciplinas %}
        <li>
            <a href="{% url 'disciplinas:detalhe' disciplina.pk %}">
                {{ disciplina.nome }}
            </a>
        </li>
    {% empty %}
        <li>Nenhuma disciplina cadastrada.</li>
    {% endfor %}
</ul>
<form method="post" action="{% url 'contas:logout' %}">
    {% csrf_token %}
    <button type="submit">Sair</button>
</form>
